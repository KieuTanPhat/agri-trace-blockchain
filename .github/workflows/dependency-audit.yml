name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Audit / ${{ matrix.lockfile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lockfile: workspaces
            directory: .
            flags: ''
          - lockfile: standalone-chaincode
            directory: blockchain/chaincode
            flags: --workspaces=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.1.0
      - name: Audit the committed lockfile, including development dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          set +e
          npm audit --package-lock-only --audit-level=moderate --json ${{ matrix.flags }} > "${RUNNER_TEMP}/audit-${{ matrix.lockfile }}.json"
          result=$?
          cat "${RUNNER_TEMP}/audit-${{ matrix.lockfile }}.json"
          exit "$result"
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.lockfile }}-${{ github.sha }}
          path: ${{ runner.temp }}/audit-${{ matrix.lockfile }}.json
          if-no-files-found: error
          retention-days: 14

  workspace-peers:
    name: Workspace dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Audit installed workspace dependencies and peers
        id: dependency-audit
        run: npm run audit:dependencies -- workspace dependency-evidence
      - name: Upload installed dependency evidence
        if: always() && steps.dependency-audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-dependencies-${{ github.sha }}
          path: dependency-evidence/workspace/
          if-no-files-found: error
          retention-days: 90

  gate:
    name: Dependency gate
    needs: [audit, workspace-peers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require both lockfile audits to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs dependency
