name: Blockchain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      blockchain: ${{ steps.changes.outputs.blockchain }}
      hybrid: ${{ steps.changes.outputs.hybrid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: node scripts/ci/changes.mjs

  verify:
    name: ${{ matrix.package }} / Node 24
    needs: changes
    if: needs.changes.outputs.blockchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [blockchain/chaincode, blockchain/gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check --workspace ${{ matrix.package }}

  standalone-chaincode:
    name: Standalone chaincode
    needs: changes
    if: needs.changes.outputs.blockchain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.1.0
      - name: Install, audit and check standalone chaincode in isolation
        id: dependency-audit
        run: npm run check:chaincode:standalone -- dependency-evidence
      - name: Upload standalone dependency evidence
        if: always() && steps.dependency-audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-chaincode-dependencies-${{ github.sha }}
          path: dependency-evidence/chaincode/
          if-no-files-found: error
          retention-days: 90

  hybrid-fabric:
    name: Hybrid B C real Fabric and browser
    needs: changes
    if: needs.changes.outputs.hybrid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: package-lock.json}
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Check that the export acceptance fails closed
        run: node --import tsx --test blockchain/network/hybrid/acceptance/export-check.test.mts
      - name: Real three-organization ledger and Worker acceptance
        run: node scripts/ci/hybrid-fabric.mjs
      - name: Enterprise-owned peer lifecycle and approvals on separated Docker networks
        run: node scripts/ci/enterprise-peer.mjs
      - name: Desktop and mobile viewport browser with real API DB Worker
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:hybrid:browser
      - name: Upload sanitized provenance and browser failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hybrid-acceptance-${{ github.sha }}
          path: |
            artifacts/agri-hybrid-*/receipt.json
            artifacts/enterprise-onboarding/receipt.json
            artifacts/agri-hybrid-*/browser-diagnostics/**
          if-no-files-found: error
          retention-days: 90

  gate:
    name: Blockchain gate
    needs: [changes, verify, standalone-chaincode, hybrid-fabric]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected blockchain checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs blockchain
