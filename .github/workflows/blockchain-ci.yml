name: Blockchain CI

on:
  push:
    paths:
      - "blockchain/**"
      - "docs/architecture/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-dependencies.mjs"
      - "scripts/check-standalone-chaincode.mjs"
      - "docs/dependency-audit-*.md"
      - ".github/workflows/blockchain-ci.yml"
  pull_request:
    paths:
      - "blockchain/**"
      - "docs/architecture/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-dependencies.mjs"
      - "scripts/check-standalone-chaincode.mjs"
      - "docs/dependency-audit-*.md"
      - ".github/workflows/blockchain-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - blockchain/chaincode
          - blockchain/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm run check --workspace ${{ matrix.package }}

  standalone-chaincode:
    runs-on: ubuntu-latest
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: blockchain/chaincode/package-lock.json
      - run: npm install --global npm@12.1.0
      - name: Install, audit and check standalone chaincode in isolation
        id: dependency-audit
        run: npm run check:chaincode:standalone -- dependency-evidence
      - name: Upload standalone dependency evidence
        if: always() && steps.dependency-audit.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-chaincode-dependencies-${{ github.run_attempt }}
          path: dependency-evidence/chaincode/
          if-no-files-found: error
          retention-days: 90

  fabric-smoke:
    needs: standalone-chaincode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
      - run: npm install --global npm@12.1.0
      - name: Bootstrap pinned Fabric runtime
        working-directory: blockchain/network
        run: ./network.sh bootstrap
      - name: Start network and create channel
        working-directory: blockchain/network
        run: ./network.sh up
      - name: Enroll technical relayer
        working-directory: blockchain/network
        run: ./network.sh enroll-relayer
      - name: Deploy and run end-to-end smoke test
        working-directory: blockchain/network
        run: ./network.sh smoke
      - name: Collect Fabric diagnostics
        if: failure()
        run: |
          docker logs peer0.org1.example.com 2>&1 | tail -n 500 || true
          docker logs peer0.org2.example.com 2>&1 | tail -n 200 || true
      - name: Stop network
        if: always()
        working-directory: blockchain/network
        run: ./network.sh down
