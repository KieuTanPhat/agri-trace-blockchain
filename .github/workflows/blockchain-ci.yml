name: Blockchain CI

on:
  push:
    paths:
      - "blockchain/**"
      - "docs/architecture/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blockchain-ci.yml"
  pull_request:
    paths:
      - "blockchain/**"
      - "docs/architecture/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blockchain-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - blockchain/chaincode
          - blockchain/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace ${{ matrix.package }}
      - run: npm run check --workspace ${{ matrix.package }}

  fabric-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bootstrap pinned Fabric runtime
        working-directory: blockchain/network
        run: ./network.sh bootstrap
      - name: Start network and create channel
        working-directory: blockchain/network
        run: ./network.sh up
      - name: Enroll technical relayer
        working-directory: blockchain/network
        run: ./network.sh enroll-relayer
      - name: Deploy and run end-to-end smoke test
        working-directory: blockchain/network
        run: ./network.sh smoke
      - name: Collect Fabric diagnostics
        if: failure()
        run: |
          docker logs peer0.org1.example.com 2>&1 | tail -n 500 || true
          docker logs peer0.org2.example.com 2>&1 | tail -n 200 || true
      - name: Stop network
        if: always()
        working-directory: blockchain/network
        run: ./network.sh down
