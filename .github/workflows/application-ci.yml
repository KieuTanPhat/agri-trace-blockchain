name: Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      containers: ${{ steps.changes.outputs.containers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: node scripts/ci/changes.mjs
      - name: Check CI selection and gates before conditional jobs
        run: node --test scripts/ci/ci.test.mjs
      - name: Validate workflow syntax and GitHub expression contexts
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''
      - name: Check CD policy, failure recovery and exact-commit gate
        run: |
          python3 -m unittest discover -s deploy/cd -p 'test_*.py' -v
          node --test deploy/cd/gate.test.mjs deploy/cd/publish.test.mjs deploy/cd/send.test.mjs deploy/cd/session-auth.test.mjs
          node --experimental-vm-modules --test deploy/cd/verify.test.mjs
          node --test scripts/ci/hybrid-restore-guards.test.mjs
          node --test deploy/hybrid-restore-run.test.mjs

  api:
    name: API / Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.15.0', '26.0.0']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/agri_trace_ci?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/agri_trace_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-tests
      IOT_INGEST_API_KEY: ci-only-device-ingest-key
      FABRIC_ENABLED: 'false'
    services:
      postgres:
        # Exercise domain/journal recovery on the same PostgreSQL major as UAT.
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: agri_trace_ci
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agri_trace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      # The API consumes Gateway's compiled workspace exports.
      - run: npm run build --workspace blockchain/gateway
      - run: npm run db:migrate --workspace apps/api
      - run: npm run check --workspace apps/api
      - name: Require Swagger and generated Web types to match the current API
        run: node scripts/generate-api-contract.mjs --check
      - name: Verify UAT bootstrap against real PostgreSQL
        env:
          UAT_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/agri_trace_ci?schema=public
        run: node --test deploy/bootstrap.test.mjs

  web:
    name: Web / Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.15.0', '26.0.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check --workspace apps/web

  hybrid:
    name: Hybrid / PostgreSQL 18 and real browser
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: postgresql://scope_test:isolated-ci-scope-only@127.0.0.1:25488/scope_test
      TEST_DATABASE_URL: postgresql://scope_test:isolated-ci-scope-only@127.0.0.1:25488/scope_test
      JWT_SECRET: isolated-ci-browser-jwt-only-not-a-production-secret
      IOT_INGEST_API_KEY: isolated-ci-device-key
      FABRIC_ENABLED: 'false'
      HYBRID_DRAFT_TESTS: '1'
      HYBRID_CI_TESTS: '1'
      HYBRID_CI_SHA: ${{ github.sha }}
      HYBRID_CI_SCOPE: hybrid-ci-${{ github.run_id }}-${{ github.run_attempt }}
      HYBRID_CI_EVIDENCE: ${{ github.workspace }}/.codex/evidence/hybrid-ci-${{ github.sha }}-${{ github.run_attempt }}
      NEXT_PUBLIC_API_SAME_ORIGIN: 'true'
      NEXT_PUBLIC_MOCK_API: 'false'
      CORS_ORIGIN: http://127.0.0.1:25600
    services:
      policy-postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: scope_test
          POSTGRES_USER: scope_test
          POSTGRES_PASSWORD: isolated-ci-scope-only
        ports:
          - 127.0.0.1:25488:5432
        options: >-
          --memory 384m --cpus 1
          --tmpfs /var/lib/postgresql:rw,size=256m
          --label agritrace.scope=hybrid-ci-${{ github.run_id }}-${{ github.run_attempt }}-policy
          --health-cmd "pg_isready -U scope_test -d scope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      browser-postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: browser_test
          POSTGRES_USER: browser_test
          POSTGRES_PASSWORD: isolated-ci-browser-only
        ports:
          - 127.0.0.1:25489:5432
        options: >-
          --memory 384m --cpus 1
          --tmpfs /var/lib/postgresql:rw,size=256m
          --label agritrace.scope=hybrid-ci-${{ github.run_id }}-${{ github.run_attempt }}-browser
          --health-cmd "pg_isready -U browser_test -d browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify dedicated database resources before preparing fixtures
        env:
          HYBRID_POLICY_CONTAINER: ${{ job.services.policy-postgres.id }}
          HYBRID_BROWSER_CONTAINER: ${{ job.services.browser-postgres.id }}
        run: |
          install -d -m 700 "$HYBRID_CI_EVIDENCE"
          node scripts/ci/hybrid-policy-run.mjs services
      - name: Ensure the host PostgreSQL SQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          psql --version
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace blockchain/gateway
      - run: npm run prisma:generate --workspace apps/api
      # The staged catalog is private evidence; tracked migration files never
      # change. Twenty-eight synthetic old-writer events precede route sealing.
      - name: Apply official migrations around the legacy fixture writer
        env:
          HYBRID_CI_CONTROL: ${{ env.HYBRID_CI_EVIDENCE }}/legacy-prepare
        run: node scripts/ci/hybrid-db-prepare.mjs legacy
      - name: Require SQL, ORM, policy HTTP and legacy E2E acceptance
        env:
          HYBRID_CI_PREPARATION: ${{ env.HYBRID_CI_EVIDENCE }}/legacy-prepare/preparation.json
          HYBRID_CI_CONTROL: ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy
        run: node scripts/ci/hybrid-policy-run.mjs
      - name: Restore the synthetic scope database and compare every row and schema guard
        env:
          HYBRID_POLICY_CONTAINER: ${{ job.services.policy-postgres.id }}
        run: node deploy/hybrid-restore-run.mjs
      - run: npm run build --workspace apps/api
      # Browser work follows the DB suite, so the two heavy suites never compete
      # for the job's application memory. This DB starts with the full catalog.
      - name: Prepare a separate fresh browser database and independent route pins
        env:
          DATABASE_URL: postgresql://browser_test:isolated-ci-browser-only@127.0.0.1:25489/browser_test
          TEST_DATABASE_URL: postgresql://browser_test:isolated-ci-browser-only@127.0.0.1:25489/browser_test
          HYBRID_CI_CONTROL: ${{ env.HYBRID_CI_EVIDENCE }}/browser-prepare
        run: node scripts/ci/hybrid-db-prepare.mjs browser
      - name: Check canonical deployment pins with the actual compiled runtime
        run: node --test deploy/hybrid-pins.test.mjs
      - name: Build the real Web app with same-origin API transport
        env:
          NODE_ENV: production
        run: npm run build --workspace apps/web
      - name: Install the Chromium revision pinned by Playwright 1.62.1
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Require seven browser groups against real API and PostgreSQL
        env:
          DATABASE_URL: postgresql://browser_test:isolated-ci-browser-only@127.0.0.1:25489/browser_test
          TEST_DATABASE_URL: postgresql://browser_test:isolated-ci-browser-only@127.0.0.1:25489/browser_test
          HYBRID_BROWSER_TESTS: '1'
          HYBRID_BROWSER_SHA: ${{ github.sha }}
          HYBRID_BROWSER_CONTROL: ${{ env.HYBRID_CI_EVIDENCE }}/browser-run
        run: node scripts/ci/hybrid-browser-run.mjs
      - name: Remove only this job's labeled database services and verify released ports
        if: always()
        env:
          HYBRID_POLICY_CONTAINER: ${{ job.services.policy-postgres.id }}
          HYBRID_BROWSER_CONTAINER: ${{ job.services.browser-postgres.id }}
        run: node scripts/ci/hybrid-policy-run.mjs cleanup
      - name: Upload safe acceptance receipts and summary logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          # Raw logs/reporter diagnostics, SQL, HTML/screenshots and fixture
          # payloads stay private on the disposable runner and are not uploaded.
          path: |
            ${{ env.HYBRID_CI_EVIDENCE }}/services.json
            ${{ env.HYBRID_CI_EVIDENCE }}/services-cleanup.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-prepare/preparation.json
            ${{ env.HYBRID_CI_EVIDENCE }}/browser-prepare/preparation.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/acceptance.log
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/schema-alignment.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/sql-result.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/orm-result.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/policy-result.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/legacy-result.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/policy-run.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-policy/policy-failure.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-restore/restore-run.json
            ${{ env.HYBRID_CI_EVIDENCE }}/legacy-restore/restore-failure.json
            ${{ env.HYBRID_CI_EVIDENCE }}/browser-run/browser-result.json
            ${{ env.HYBRID_CI_EVIDENCE }}/browser-run/app-cleanup.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  container-build:
    name: Production containers
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE_PROJECT_NAME: agri-trace-ci
      FABRIC_ENABLED: 'false'
      HYBRID_CONTAINER_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Check technical fixture vectors and refusal guards
        run: node --test deploy/hybrid-route-fixture.test.mjs
      - name: Prepare explicit technical route pins before any database registration
        run: node deploy/hybrid-route-fixture.mjs prepare --stack standard --directory .codex/evidence/hybrid-standard-route
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build production images including Worker
        run: docker compose build api worker web
      - name: Migrate the fresh database and register only the independently pinned CI definition
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          docker compose run --rm --no-deps api npm run db:migrate --workspace apps/api
          node deploy/hybrid-route-fixture.mjs register --stack standard --directory .codex/evidence/hybrid-standard-route
      - name: Start the complete production stack against a disposable database
        run: docker compose up -d --wait --wait-timeout 240 postgres api worker web
      - name: Verify API, Web and internal Worker health
        run: |
          curl --fail --retry 3 http://localhost:8080/api/health
          curl --fail --retry 3 --output /dev/null http://localhost:3000/login
          docker compose exec -T web node --input-type=module -e "
            import assert from 'node:assert/strict';
            const r = await fetch('http://127.0.0.1:3000/_next/image?url=%2Flogo.png&w=64&q=75', {
              headers: { Accept: 'image/webp' }
            });
            assert.equal(r.status, 200);
            assert.equal(r.headers.get('content-type'), 'image/webp');
            const b = Buffer.from(await r.arrayBuffer());
            assert.equal(b.toString('ascii', 0, 4), 'RIFF');
            assert.equal(b.toString('ascii', 8, 12), 'WEBP');
          "
          docker compose exec -T worker node --input-type=module -e "
            import assert from 'node:assert/strict';
            const r = await fetch('http://127.0.0.1:8081/health/ready');
            assert.equal(r.status, 200);
            const h = await r.json();
            assert.equal(h.service, 'agri-trace-blockchain-worker');
            assert.equal(h.runtime.enabled, false);
            assert.equal(h.runtime.running, false);
            assert.equal(h.backlog.deadLetter, 0);
          "
      - name: Collect application diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop standard stack before UAT rehearsal
        run: docker compose stop
      - name: Check UAT origins and aliases
        run: node --test deploy/config.test.mjs
      - name: Prepare private UAT configuration
        env:
          COMPOSE_PROJECT_NAME: agri-trace-uat-ci
        run: |
          npm run build --workspace blockchain/chaincode
          node deploy/prepare.mjs --directory .uat/ci --origin http://127.0.0.1:18080 --release "uat-${GITHUB_SHA}"
          node deploy/hybrid-route-fixture.mjs prepare --stack uat --directory .codex/evidence/hybrid-uat-route --env .uat/ci/.env.uat
          node deploy/preflight.mjs --env .uat/ci/.env.uat
          node deploy/prepare.mjs --directory .uat/https --origin https://agritrace.dev --release "uat-${GITHUB_SHA}"
          node deploy/preflight.mjs --env .uat/https/.env.uat --config-only
          https_dc=(docker compose --env-file .uat/https/.env.uat -f docker-compose.uat.yml -f docker-compose.uat-https.yml)
          "${https_dc[@]}" run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile
      - name: Build and start UAT through the HTTP proxy
        env:
          COMPOSE_PROJECT_NAME: agri-trace-uat-ci
        run: |
          dc=(docker compose --env-file .uat/ci/.env.uat -f docker-compose.uat.yml)
          "${dc[@]}" build api web
          "${dc[@]}" up -d --wait --wait-timeout 120 postgres
          python3 deploy/cd/check-migrate.py --env .uat/ci/.env.uat
          node deploy/hybrid-route-fixture.mjs register --stack uat --directory .codex/evidence/hybrid-uat-route --env .uat/ci/.env.uat
          "${dc[@]}" --profile tools run --rm bootstrap
          "${dc[@]}" --profile tools run --rm bootstrap
          # Exercise the actual runtime image (production dependencies only).
          "${dc[@]}" run --rm --no-deps api npm run db:provision-compliance-role --workspace apps/api | tee .uat/ci/role-first.log
          "${dc[@]}" run --rm --no-deps api npm run db:provision-compliance-role --workspace apps/api | tee .uat/ci/role-replay.log
          grep -Fx 'COMPLIANCE_REVIEWER provisioned; created=1' .uat/ci/role-first.log
          grep -Fx 'COMPLIANCE_REVIEWER provisioned; created=0' .uat/ci/role-replay.log
          "${dc[@]}" up -d --wait --wait-timeout 240 api worker web proxy
          node deploy/smoke.mjs --env .uat/ci/.env.uat --expect-proof PENDING
          "${dc[@]}" run --rm --no-deps -e APP_ENV=uat -e UAT_VALIDATOR_PATH=/validator/validation.js -v "$PWD/blockchain/chaincode/dist:/validator:ro" --entrypoint node api apps/api/scripts/check-uat-events.mjs
      - name: Rehearse UAT backup and restore into an empty disposable database
        env:
          COMPOSE_PROJECT_NAME: agri-trace-uat-ci
        run: |
          dc=(docker compose --env-file .uat/ci/.env.uat -f docker-compose.uat.yml)
          "${dc[@]}" stop api worker
          node deploy/database.mjs backup-uat --env .uat/ci/.env.uat --file .uat/ci/rehearsal.dump
          # This project exists only in this CI job; never use this reset on a VPS.
          "${dc[@]}" down --volumes --remove-orphans
          "${dc[@]}" up -d --wait --wait-timeout 120 postgres
          node deploy/database.mjs restore-empty --env .uat/ci/.env.uat --file .uat/ci/rehearsal.dump
          "${dc[@]}" --profile tools run --rm migrate
          "${dc[@]}" --profile tools run --rm bootstrap
          "${dc[@]}" up -d --wait --wait-timeout 240 api worker web proxy
          node deploy/smoke.mjs --env .uat/ci/.env.uat --expect-proof PENDING
      - name: Collect UAT HTTP diagnostics
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: agri-trace-uat-ci
        run: |
          if [ -f .uat/ci/.env.uat ]; then
            docker compose --env-file .uat/ci/.env.uat -f docker-compose.uat.yml ps --all
            docker compose --env-file .uat/ci/.env.uat -f docker-compose.uat.yml logs --no-color --tail 80 web proxy
          fi
      - name: Stop disposable UAT stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: agri-trace-uat-ci
        run: |
          if [ -f .uat/ci/.env.uat ]; then
            docker compose --env-file .uat/ci/.env.uat -f docker-compose.uat.yml down --volumes --remove-orphans
          fi
      - name: Stop disposable application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload public route-definition fixture receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-route-fixtures-${{ github.sha }}
          path: |
            .codex/evidence/hybrid-standard-route/preparation.json
            .codex/evidence/hybrid-standard-route/registration.json
            .codex/evidence/hybrid-uat-route/preparation.json
            .codex/evidence/hybrid-uat-route/registration.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Rehearse production database retention on this disposable runner
        run: python3 deploy/cd/rehearse-production.py

  gate:
    name: Application gate
    needs: [changes, api, web, container-build, hybrid]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all selected application checks to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.mjs application
