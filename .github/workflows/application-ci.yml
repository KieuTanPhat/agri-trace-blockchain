name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/agri_trace_ci?schema=public
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/agri_trace_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-tests
      IOT_INGEST_API_KEY: ci-only-device-ingest-key
      FABRIC_ENABLED: "false"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agri_trace_ci
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agri_trace_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/api
          - apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json
      # Install from the repository root so npm links local workspace packages.
      # The API imports @agri-trace/fabric-gateway from blockchain/gateway.
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - name: Audit all workspace dependencies and installed peers
        id: dependency-audit
        run: npm run audit:dependencies -- workspace dependency-evidence
      # The gateway package exports its compiled declarations from dist/.
      - run: npm run build --workspace blockchain/gateway
      - name: Apply API database migrations
        if: matrix.package == 'apps/api'
        run: npm run db:migrate --workspace apps/api
      - run: npm run check --workspace ${{ matrix.package }}
      - name: Upload dependency audit evidence
        if: always() && steps.dependency-audit.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application-${{ matrix.package == 'apps/api' && 'api' || 'web' }}-dependencies-${{ github.run_attempt }}
          path: dependency-evidence/workspace/
          if-no-files-found: error
          retention-days: 90

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build api web
      - name: Start production containers against a disposable database
        run: docker compose up -d --wait --wait-timeout 180 postgres api web
      - name: Verify production HTTP entrypoints
        run: |
          curl --fail --retry 3 http://localhost:8080/api/health
          curl --fail --retry 3 --output /dev/null http://localhost:3000/login
      - name: Collect application diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop disposable application stack
        if: always()
        run: docker compose down --volumes

  application-gate:
    name: Application gate
    needs: [verify, container-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all application checks to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container-build.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$CONTAINER_RESULT" = success

  dependency-gate:
    name: Dependency gate
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require workspace dependency audit and checks to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
