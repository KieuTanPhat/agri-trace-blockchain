name: Application CI

on:
  push:
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/api
          - apps/web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agri_trace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agri_trace_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agri_trace_test?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Install from the repository root so npm links local workspace packages.
      # The API imports @agri-trace/fabric-gateway from blockchain/gateway.
      - run: npm ci
      # The gateway package exports its compiled declarations from dist/.
      - run: npm run build --workspace blockchain/gateway
      - name: Apply migrations to the API test database
        if: matrix.package == 'apps/api'
        run: npm run db:migrate --workspace apps/api
      - run: npm run check --workspace ${{ matrix.package }}
