name: Application CI

on:
  push:
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/api
          - apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace ${{ matrix.package }}
      - run: npm run check --workspace ${{ matrix.package }}
