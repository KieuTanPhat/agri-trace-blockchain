name: Production CD
on:
  push:
    branches: [main]
    paths: ['apps/**', 'blockchain/**', 'deploy/**', '.github/**', 'scripts/ci/**', 'docker-compose*.yml', 'package*.json', '.dockerignore', '.env.deploy.example', '.npmrc', '.node-version', '.nvmrc']
  workflow_dispatch:
    inputs:
      operation:
        description: Production delivery (enable after legacy adoption and release acceptance)
        type: choice
        options: [deploy, upgrade, forward, rollback, recover]
        default: deploy
      rollback_sha: {description: Previously verified full SHA for rollback, type: string, required: false}
      expected_sequence: {description: Current Fabric sequence for upgrade, type: string, required: false}
permissions: {contents: read, actions: read, packages: write}
concurrency: {group: contabo-production-delivery, cancel-in-progress: false}
jobs:
  deploy:
    uses: ./.github/workflows/deploy-environment.yml
    secrets:
      CD_SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
    with:
      operation: ${{ inputs.operation || 'deploy' }}
      rollback_sha: ${{ inputs.rollback_sha || '' }}
      expected_sequence: ${{ inputs.expected_sequence || '' }}
