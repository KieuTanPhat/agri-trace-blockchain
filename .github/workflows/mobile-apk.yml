name: Mobile APK

# Installable Android build for testing on real phones. Signed with the debug key
# that `expo prebuild` generates, so it can be sideloaded but not published to a store.
# Not a required check and not a deployment input.
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/mobile

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_PUBLIC_API_BASE_URL: https://agritrace.dev/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # The runner image ships JDK 17 and the Android SDK with its licenses already accepted.
      - run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - run: npm install --global npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      # The wrapper downloads Gradle on first use; retry transient network resets.
      - name: Download the Gradle distribution
        working-directory: apps/mobile/android
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK after the commit
        run: |
          short="$(git rev-parse --short=12 HEAD)"
          mkdir -p "${RUNNER_TEMP}/apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${RUNNER_TEMP}/apk/agritrace-${short}.apk"
          sha256sum "${RUNNER_TEMP}/apk/agritrace-${short}.apk" | tee "${RUNNER_TEMP}/apk/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agritrace-android-${{ github.sha }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 14
