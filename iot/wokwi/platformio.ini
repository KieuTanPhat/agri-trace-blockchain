[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.0
  espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
lib_deps = beegee-tokyo/DHT sensor library for ESPx@1.19.0
monitor_speed = 115200

