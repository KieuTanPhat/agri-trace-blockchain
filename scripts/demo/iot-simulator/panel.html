<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafafa">
<meta name="description" content="Bảng điều khiển mô phỏng thiết bị IoT cho AgriTrace.">
<title>Thiết bị ảo · AgriTrace</title>
<style>
  :root {
    color-scheme: light;
    --ink: #111;
    --text: #333;
    --muted: #777;
    --line: #e6e6e6;
    --soft: #f6f6f6;
    --bg: #fafafa;
    --ok: #1f8a4c;
    --warn: #b7791f;
    --bad: #c0392b;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; }
  body { margin: 0; color: var(--text); background: var(--bg); font-size: 13px; line-height: 1.45; }
  button, input, select { color: inherit; font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11px; overflow-wrap: anywhere; }
  .topbar { border-bottom: 1px solid var(--line); background: #fff; }
  .wrap { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }
  .topbar .wrap { display: flex; min-height: 52px; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none; }
  .brand span { color: var(--muted); font-weight: 500; }
  .top-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
  .top-meta code { color: var(--text); }
  .page { padding: 16px 0 40px; }
  .create { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .field { display: flex; flex: 1 1 170px; flex-direction: column; gap: 4px; }
  .field label { color: var(--muted); font-size: 11px; font-weight: 600; }
  .control { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .create-note { width: 100%; margin: 2px 0 0; color: var(--muted); font-size: 11px; }
  .button, .create-button { display: inline-flex; height: 30px; align-items: center; justify-content: center; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .button:hover { background: var(--soft); }
  .create-button { height: 34px; padding: 0 14px; border-color: var(--ink); background: var(--ink); color: #fff; }
  .button.primary { border-color: var(--ink); background: var(--ink); color: #fff; }
  .button.danger { color: var(--bad); }
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 8px; }
  .list-head h2 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-items: start; gap: 10px; }
  .device-card { display: flex; min-width: 0; min-height: 196px; flex-direction: column; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .card-top { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
  .card-title { min-width: 0; }
  .card-title h3 { overflow: hidden; margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .card-code { display: flex; align-items: center; gap: 2px; color: var(--muted); }
  .card-code code { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  .copy-button { padding: 1px 4px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 11px; }
  .copy-button:hover { background: var(--soft); color: var(--ink); }
  .copy-button svg { width: 11px; height: 11px; vertical-align: -1px; }
  .state { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 5px; color: var(--text); font-size: 11px; font-weight: 600; }
  .state::before { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); content: ""; }
  .state.warn::before { background: var(--warn); }
  .card-place { overflow: hidden; margin-top: 8px; color: var(--text); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .card-note { margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .card-note.bad { color: var(--bad); }
  .card-body { margin-top: 10px; }
  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; }
  .metric { min-width: 0; padding: 7px 4px; text-align: center; }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric span { display: block; color: var(--muted); font-size: 10px; }
  .metric b { display: block; color: var(--ink); font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .trip-route { overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .trip-measure { margin-top: 4px; color: var(--muted); font-size: 11px; }
  .bar { height: 4px; overflow: hidden; margin-top: 5px; border-radius: 2px; background: var(--soft); }
  .bar > span { display: block; height: 100%; background: var(--ink); }
  .trip-wait { margin: 0; color: var(--muted); font-size: 12px; }
  .card-foot { display: flex; gap: 6px; margin-top: auto; padding-top: 10px; }
  .card-foot button { flex: 1 1 0; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); font-size: 12px; font-weight: 600; }
  .card-foot button[aria-expanded="true"] { background: var(--soft); color: var(--ink); }
  .details-body { padding: 8px 0 0; }
  .details-body .row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .details-body select, .details-body input { height: 30px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 12px; }
  .details-body label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
  .muted { color: var(--muted); font-size: 11px; }
  .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 8px; margin: 8px 0 0; font-size: 11px; }
  .kv dt { color: var(--muted); }
  .kv dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
  ol.log { max-height: 120px; overflow: auto; margin: 8px 0 0; padding-left: 16px; color: var(--muted); font-size: 11px; }
  .empty-state { grid-column: 1 / -1; padding: 28px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
  .toast { position: fixed; z-index: 10; right: 16px; bottom: 16px; max-width: min(380px, calc(100vw - 32px)); padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 12px; box-shadow: 0 6px 20px rgb(0 0 0 / 8%); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.visible { opacity: 1; }
  .toast.error { color: var(--bad); }
  @media (max-width: 560px) {
    .top-meta .api { display: none; }
    .create-button { width: 100%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">AgriTrace <span>· Thiết bị ảo</span></a>
    <div class="top-meta"><span class="api">API <code id="api"></code></span><span id="device-count">0 thiết bị</span></div>
  </div>
</header>

<main class="page wrap">
  <section class="create" id="create-panel" aria-label="Thêm thiết bị mô phỏng">
    <div class="field"><label for="kind">Loại thiết bị</label><select class="control" id="kind"><option value="GPS_TRACKER">GPS trên xe</option><option value="FIELD_SENSOR">Cảm biến vùng trồng</option></select></div>
    <div class="field"><label for="name">Tên gợi nhớ (tùy chọn)</label><input class="control" id="name" placeholder="VD: GPS xe Đà Lạt" autocomplete="off"></div>
    <div class="field"><label for="code">Mã thiết bị cũ (để nhận lại)</label><input class="control" id="code" placeholder="Để trống nếu tạo mới" autocomplete="off"></div>
    <button class="create-button" id="create-button" type="button" onclick="create()">Tạo thiết bị</button>
    <p class="create-note">Sau khi tạo, đăng ký mã và khóa công khai ở AgriTrace → Thiết bị IoT rồi gắn vào thửa hoặc xe.</p>
  </section>
  <div class="list-head"><h2>Danh sách thiết bị</h2><span id="device-subtitle" class="muted"></span></div>
  <section id="devices" class="device-grid" aria-live="polite" aria-label="Danh sách thiết bị mô phỏng"></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
let provinces = [];
const open = new Set();
let toastTimer;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>\"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));
const icon = (kind) => kind === 'GPS_TRACKER'
  ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="9" r="2.4" stroke="currentColor" stroke-width="1.7"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/></svg>';
function notify(message, error = false) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.classList.toggle('error', error);
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 3400);
}
async function call(path, body, method = 'POST') {
  try {
    const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    if (!r.ok) { notify(j.error || 'Không thể thực hiện thao tác.', true); return null; }
    await refresh();
    if (path === '/api/devices') {
      $('#name').value = '';
      $('#code').value = '';
      notify('Đã tạo thiết bị. Sao chép mã và khóa công khai để đăng ký trên AgriTrace.');
    }
    return j;
  } catch {
    notify('Không kết nối được simulator. Hãy tải lại trang và thử lại.', true);
    return null;
  }
}
const create = () => call('/api/devices', { kind: $('#kind').value, name: $('#name').value, deviceCode: $('#code').value });
const act = (id, a, body = {}) => call(`/api/devices/${id}/${a}`, body);
const del = (id) => confirm('Xóa thiết bị ảo này? Khóa riêng của nó sẽ mất (bản sao lưu vẫn được giữ trong .iot-simulator).') && call(`/api/devices/${id}`, null, 'DELETE');
const copy = async (text) => {
  try { await navigator.clipboard.writeText(text); notify('Đã sao chép vào bộ nhớ tạm.'); }
  catch { notify('Trình duyệt không cho phép sao chép. Hãy chọn và sao chép thủ công.', true); }
};
const LABEL = { TEMPERATURE: 'Nhiệt độ', HUMIDITY: 'Độ ẩm KK', SOIL_MOISTURE: 'Độ ẩm đất' };
function localNow() {
  const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}
function agriStatus(d) {
  if (d.assignmentError) return `<div class="card-note bad" title="${esc(d.assignmentError)}">${esc(d.assignmentError)}</div>`;
  if (!d.assignment) return '<div class="card-note">Đang kết nối AgriTrace</div>';
  return d.assignment.device.active ? '' : '<div class="card-note bad">AgriTrace: thiết bị đã ngừng</div>';
}
function attached(d) {
  const a = d.assignment;
  if (!a) return 'Chưa đồng bộ';
  if (a.plot) return `${esc(a.plot.farmName)} · ${esc(a.plot.name)}`;
  if (a.vehicle) return `Xe ${esc(a.vehicle.registration)} · ${esc(a.vehicle.kind)}`;
  return 'Chưa gắn vào thửa hoặc xe';
}
function placeNote(d) {
  const p = d.assignment?.plot;
  if (p) return `<div class="card-note" title="${p.runningCycles.map(esc).join(', ')}">${p.runningCycles.length ? p.runningCycles.length + ' vụ đang nhận dữ liệu' : 'Thửa chưa có vụ đang trồng'}</div>`;
  if (d.kind === 'GPS_TRACKER') return `<div class="card-note">${d.power === 'MAINS' ? 'Nguồn xe' : d.power === 'OFF' ? 'Đã tắt' : 'Pin ' + d.battery + '%'}</div>`;
  return '';
}
function tripBlock(d) {
  const t = d.trip;
  if (!t) return `<p class="trip-wait">${d.mode === 'AUTO' ? 'Chờ phiếu: ký lấy hàng để GPS tự chạy.' : 'Chế độ thủ công.'}</p>`;
  const pct = Math.min(100, (t.progressKm / t.totalKm) * 100);
  const state = t.arrivedAt ? 'Đã tới nơi' : t.stopped ? 'Đang dừng' : `${t.speed} km/h`;
  return `<div class="trip-route" title="${esc(t.routeName)}">${esc(t.routeName)}</div>
    <div class="trip-measure">${t.progressKm} / ${t.totalKm} km · ${state}${t.estimated ? ' · ước lượng' : ''}${t.transferId ? '' : ' · thủ công'}</div>
    <div class="bar"><span style="width:${pct}%"></span></div>`;
}
function fieldBlock(d) {
  const r = d.lastReadings ?? {};
  return `<div class="metrics">${['TEMPERATURE', 'HUMIDITY', 'SOIL_MOISTURE'].map((k) => `<div class="metric"><span>${LABEL[k]}</span><b>${r[k] ?? '—'}</b></div>`).join('')}</div>`;
}
function adjustments(d) {
  return `<div class="row">
      <span class="muted" style="width:64px">Nhiệt độ</span>
      <button type="button" class="button" aria-label="Giảm nhiệt độ 1 độ C" onclick="act('${d.id}','sensor_adjust',{metric:'TEMPERATURE',delta:-1})">−1°</button>
      <button type="button" class="button" aria-label="Tăng nhiệt độ 1 độ C" onclick="act('${d.id}','sensor_adjust',{metric:'TEMPERATURE',delta:1})">+1°</button>
    </div>
    <div class="row" style="margin-top:5px">
      <span class="muted" style="width:64px">Độ ẩm KK</span>
      <button type="button" class="button" aria-label="Giảm độ ẩm không khí 5 phần trăm" onclick="act('${d.id}','sensor_adjust',{metric:'HUMIDITY',delta:-1})">−5%</button>
      <button type="button" class="button" aria-label="Tăng độ ẩm không khí 5 phần trăm" onclick="act('${d.id}','sensor_adjust',{metric:'HUMIDITY',delta:1})">+5%</button>
    </div>
    <p class="muted" style="margin:6px 0">Đo mỗi ${d.intervalSec} giây${d.drought ? ' · đang khô hạn' : ''}</p>`;
}
function toggle(key) {
  if (open.has(key)) open.delete(key); else open.add(key);
  render();
}
function incidents(d) {
  const gps = d.kind === 'GPS_TRACKER';
  return `<div class="row">
    ${d.manualSignal ? `<button class="button" onclick="act('${d.id}','signal_off')">Mất sóng</button>` : `<button class="button" onclick="act('${d.id}','signal_on')">Có sóng lại</button>`}
    ${gps && d.trip ? (d.trip.stopped ? `<button class="button" onclick="act('${d.id}','resume')">Chạy tiếp</button>` : `<button class="button" onclick="act('${d.id}','stop')">Dừng bất thường</button>`) : ''}
    ${gps && d.trip && !d.trip.arrivedAt ? `<button class="button" onclick="act('${d.id}','arrive')">Đã tới</button>` : ''}
    ${gps && d.power !== 'MAINS' ? `<button class="button" onclick="act('${d.id}','plug')">Cắm nguồn</button>` : ''}
    ${gps ? `<button class="button" onclick="act('${d.id}','spoof')">GPS giả mạo</button>` : `<button class="button" onclick="act('${d.id}','drought')">${d.drought ? 'Hết khô hạn' : 'Khô hạn'}</button><button class="button" onclick="act('${d.id}','irrigate')">Tưới</button>`}
    <button class="button" onclick="act('${d.id}','forge')">Giả chữ ký</button>
  </div>`;
}
function advanced(d) {
  const gps = d.kind === 'GPS_TRACKER';
  const options = (sel) => provinces.map((p) => `<option value="${p.code}" ${p.code === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const manual = gps ? `
    <p class="muted" style="margin:2px 0 8px">${d.mode === 'AUTO' ? 'Thiết bị đang tự chạy theo phiếu. Bạn cũng có thể chạy tuyến demo thủ công:' : 'Chế độ thủ công: chọn tuyến rồi chạy thử.'}</p>
    <div class="row"><select aria-label="Tỉnh xuất phát" id="fm-${d.id}">${options('68')}</select><span class="muted">→</span><select aria-label="Tỉnh đến" id="dm-${d.id}">${options('79')}</select></div>
    <div class="row" style="margin-top:7px"><label>Xuất phát <input aria-label="Thời điểm xuất phát" type="datetime-local" id="t-${d.id}" value="${localNow()}"></label>
      <button class="button" onclick="act('${d.id}','trip',{from:{code:document.getElementById('fm-${d.id}').value},to:{code:document.getElementById('dm-${d.id}').value},departAt:new Date(document.getElementById('t-${d.id}').value).toISOString()})">Chạy thử tuyến</button>
      ${d.mode === 'AUTO' ? '' : `<button class="button primary" onclick="act('${d.id}','auto')">Về tự động</button>`}
      ${d.trip ? `<button class="button" onclick="act('${d.id}','end_trip')">Kết thúc chuyến</button>` : ''}</div>` : `
    <div class="row">
      <button class="button" onclick="act('${d.id}','interval',{seconds:60})">Đo mỗi 60 giây</button>
      <button class="button" onclick="act('${d.id}','interval',{seconds:300})">Đo mỗi 5 phút</button>
      <button class="button" onclick="act('${d.id}','backfill',{days:Number(prompt('Số ngày lịch sử', '60'))})">Nạp lịch sử</button></div>`;
  return `<div class="details-body">${manual}
    <dl class="kv"><dt>Khóa công khai</dt><dd><code>${esc(d.publicKey)}</code> <button class="copy-button" onclick="copy('${d.publicKey}')">Chép khóa</button>
      <dt>Số thứ tự kế</dt><dd>${d.sequence} · lưu tạm ${d.queue} bản ghi</dd>
      <dt>Bản tin gần nhất</dt><dd>${d.lastResult ? `nhận ${d.lastResult.accepted} · trùng ${d.lastResult.duplicates} · muộn ${d.lastResult.late} · bất thường ${d.lastResult.anomalies}` : 'chưa gửi'}${d.lastError ? ` · <span style="color:var(--bad)">${esc(d.lastError)}</span>` : ''}</dd></dl>
    <div class="row" style="margin-top:8px">
      <button class="button" onclick="confirm('Tạo khóa mới? Cần Đổi khóa trong AgriTrace.') && act('${d.id}','rotate_key')">Tạo khóa mới</button>
      <button class="button danger" onclick="del('${d.id}')">Xóa thiết bị</button></div>
    <ol class="log">${d.log.map((l) => `<li>${esc(l)}</li>`).join('')}</ol></div>`;
}
function card(d) {
  const gps = d.kind === 'GPS_TRACKER';
  const state = d.signal ? '<span class="state">Online</span>' : '<span class="state warn">Mất sóng</span>';
  const inc = `inc-${d.id}`, adv = `adv-${d.id}`;
  return `<article class="device-card">
    <div class="card-top">
      <div class="card-title"><h3 title="${esc(d.name)}">${esc(d.name)}</h3><div class="card-code"><code>${esc(d.deviceCode)}</code><button class="copy-button" aria-label="Sao chép mã thiết bị" onclick="copy('${d.deviceCode}')"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.2" y="5.2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 5V3.8A1.8 1.8 0 0 0 8.7 2H3.8A1.8 1.8 0 0 0 2 3.8v4.9a1.8 1.8 0 0 0 1.8 1.8H5" stroke="currentColor" stroke-width="1.3"/></svg></button></div></div>
      ${state}
    </div>
    <div class="card-place" title="${attached(d)}">${attached(d)}</div>
    ${placeNote(d)}${agriStatus(d)}
    <div class="card-body">${gps ? tripBlock(d) : fieldBlock(d)}</div>
    <div class="card-foot">
      <button type="button" aria-expanded="${open.has(inc)}" onclick="toggle('${inc}')">${gps ? 'Sự cố' : 'Điều chỉnh'}</button>
      <button type="button" aria-expanded="${open.has(adv)}" onclick="toggle('${adv}')">Nâng cao</button>
    </div>
    ${open.has(inc) ? `<div class="details-body">${gps ? '' : adjustments(d)}${incidents(d)}</div>` : ''}
    ${open.has(adv) ? advanced(d) : ''}
  </article>`;
}
function emptyState() {
  return '<div class="empty-state">Chưa có thiết bị. Tạo một thiết bị mô phỏng ở trên để bắt đầu.</div>';
}
let last = null;
function render() {
  if (!last) return;
  const focused = document.activeElement?.id;
  if (focused && /^(t|fm|dm)-/.test(focused)) return;
  const saved = {};
  document.querySelectorAll('#devices select[id], #devices input[id]').forEach((el) => (saved[el.id] = el.value));
  $('#devices').innerHTML = last.devices.map(card).join('') || emptyState();
  $('#device-count').textContent = `${last.devices.length} thiết bị`;
  $('#device-subtitle').textContent = last.devices.length ? 'Tự làm mới mỗi 2 giây' : '';
  for (const [id, value] of Object.entries(saved)) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }
}
async function refresh() {
  try {
    const response = await fetch('/api/state');
    if (!response.ok) throw new Error('state');
    last = await response.json();
    provinces = last.provinces;
    $('#api').textContent = last.api;
    render();
  } catch {
    $('#api').textContent = 'Chưa kết nối';
    $('#device-subtitle').textContent = 'Mất kết nối simulator, hãy tải lại trang';
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
