# Only an administrator-provisioned, environment-owned binding enables signing.
services:
  worker:
    user: ${WORKER_UID:?Set signer UID}:${WORKER_GID:?Set signer GID}
    environment:
      FABRIC_ENABLED: "true"
      FABRIC_NETWORK_NAME: hyperledger-fabric
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:?Set channel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:?Set chaincode}
      FABRIC_CONTRACT_NAME: ${FABRIC_CONTRACT_NAME:-AgriTraceContract}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:?Set signer MSP}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:?Set peer endpoint}
      FABRIC_PEER_HOST_ALIAS: ${FABRIC_PEER_HOST_ALIAS:?Set peer TLS hostname}
      FABRIC_SAMPLES_DIR: /fabric-public
      FABRIC_TLS_CERT_PATH: /fabric-tls/ca.crt
      RELAYER_MSP_DIR: /fabric-identity
      FABRIC_IDENTITY_CERT_PATH: /fabric-identity/signcerts/cert.pem
      FABRIC_IDENTITY_KEY_DIR: /fabric-identity/keystore
      FABRIC_WORKER_INTERVAL_MS: "10000"
      FABRIC_WORKER_BATCH_SIZE: "10"
      FABRIC_CLAIM_LEASE_MS: "120000"
      FABRIC_MAX_RETRIES: "5"
      FABRIC_MAX_RETRY_DELAY_MS: "300000"
    volumes:
      - type: bind
        source: ${RELAYER_MSP_DIR_HOST:?Set own relayer MSP}
        target: /fabric-identity
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${FABRIC_TLS_CERT_HOST:?Set own peer TLS CA}
        target: /fabric-tls/ca.crt
        read_only: true
        bind: {create_host_path: false}
    networks: [default, fabric]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health/ready').then(async r=>{const h=await r.json();if(!r.ok||!h.runtime.enabled||!h.runtime.running||h.runtime.lastError||h.backlog.deadLetter)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
networks:
  fabric:
    external: true
    name: ${FABRIC_DOCKER_NETWORK:?Provision own Fabric network}
