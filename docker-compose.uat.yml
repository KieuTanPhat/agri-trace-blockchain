name: agri-trace-uat

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-image: &api-image
  image: agri-trace-api:${RELEASE_TAG:?Set RELEASE_TAG}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

x-database: &database
  DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a pinned PostgreSQL 18 image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA below this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1.0
    logging: *logs

  migrate:
    <<: *api-image
    profiles: [tools]
    init: true
    restart: "no"
    environment: *database
    command: [npm, run, db:migrate, --workspace, apps/api]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    logging: *logs

  bootstrap:
    <<: *api-image
    user: ${BOOTSTRAP_UID:-1000}:${BOOTSTRAP_GID:-1000}
    profiles: [tools]
    init: true
    restart: "no"
    environment:
      <<: *database
      NODE_ENV: production
      APP_ENV: uat
      UAT_BOOTSTRAP_ENABLED: "true"
      UAT_ACCOUNTS_FILE: /run/secrets/uat_accounts
    secrets: [uat_accounts]
    command: [node, apps/api/scripts/bootstrap-uat.mjs]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    logging: *logs

  api:
    <<: *api-image
    restart: unless-stopped
    init: true
    environment:
      <<: *database
      NODE_ENV: production
      PORT: "8080"
      TRUST_PROXY_HOPS: "1"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_DAYS: "7"
      IOT_INGEST_API_KEY: ${IOT_INGEST_API_KEY:?Set IOT_INGEST_API_KEY}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      PUBLIC_TRACE_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/trace
      FABRIC_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=512
    command: [node, apps/api/dist/main.js]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *logs

  worker:
    <<: *api-image
    restart: unless-stopped
    init: true
    environment:
      <<: *database
      NODE_ENV: production
      WORKER_HEALTH_PORT: "8081"
      FABRIC_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=320
    command: [node, apps/api/dist/worker-main.js]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health/ready').then(async r=>{const h=await r.json();if(!r.ok||h.runtime.enabled||h.runtime.running)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 120s
    mem_limit: 512m
    cpus: 0.5
    logging: *logs

  web:
    image: agri-trace-web:${RELEASE_TAG:?Set RELEASE_TAG}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/api
        NEXT_PUBLIC_TRACE_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/trace
        NEXT_PUBLIC_MOCK_API: "false"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *logs

  proxy:
    image: ${CADDY_IMAGE:?Set a pinned Caddy image}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./deploy/Caddyfile.uat
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging: *logs

secrets:
  uat_accounts:
    file: ${UAT_ACCOUNTS_FILE:?Set UAT_ACCOUNTS_FILE}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
